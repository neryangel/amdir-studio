title: Event Pro Studio
status: pilot
summary: >-
  מערכת עבודה לצלמי אירועים: פנייה, הצעת מחיר, חוזה וגלריה פרטית לבחירת
  תמונות, בתהליך אחד. מוצר של AMDIR. האפליקציה פועלת בנפרד מהאתר הזה.
features:
  - פניות ולקוחות במקום אחד
  - הצעות מחיר וחוזים עם חתימה דיגיטלית
  - גלריות פרטיות עם קישור מוגבל בזמן, לבחירת תמונות על ידי הלקוח
  - רשימת צילומים, ציר זמן וצוות לכל אירוע
facts:
  - הפיילוט פועל ללא זיהוי פנים.
  - הפיילוט בהזמנה בלבד, ובשלב זה אין בו סליקה.
legalDraft:
  - הצלמים נשארים אחראים לקבלת הסכמה מהלקוחות שלהם ומהמצולמים, לפני העלאת תמונות למערכת.
