title: אתרים
summary: >-
  אתרים בעברית לעסקים, אמנים ואירועים. מהירים, נגישים, מותאמים לנייד, עם טופס
  פנייה שמגיע אליכם בפועל.
cover: ../../assets/services/websites/cover.png
coverAlt: תמונה זמנית, שרטוט מופשט של עמוד אתר
whoFor:
  - עסק שירות שצריך אתר ברור שמביא פניות
  - אמן או הרכב שצריך בית לקליפים, להופעות ולפרטי קשר
  - אירוע שצריך דף נחיתה עם תאריך, מקום והרשמה
whatYouGet:
  - אפיון קצר ועיצוב שמתאים לכם, לא תבנית
  - אתר בעברית, מימין לשמאל, מותאם לנייד ונגיש
  - טופס פנייה שמגיע ישירות אליכם
  - SEO בסיסי, מפת אתר ונתונים מובנים
  - הדרכה לעדכון תוכן
timeline:
  - stage: אפיון ומבנה עמודים
    min: 3
    max: 5
    unit: days
  - stage: עיצוב
    min: 1
    max: 2
    unit: weeks
  - stage: פיתוח
    min: 1
    max: 3
    unit: weeks
  - stage: בדיקות ועלייה לאוויר
    min: 2
    max: 4
    unit: days
process:
  - title: שיחת היכרות
    text: מה האתר צריך לעשות, למי, ואיזה תוכן כבר קיים.
  - title: אפיון ומבנה
    text: מבנה עמודים, תוכן לכל עמוד, ולוח זמנים בכתב.
  - title: עיצוב לאישור
    text: עיצוב של העמודים המרכזיים, בנייד ובמחשב, לפני שכותבים קוד.
  - title: פיתוח ובדיקות
    text: גרסה עובדת בכתובת זמנית, לבדיקה שלכם לפני העלייה לאוויר.
  - title: עלייה לאוויר
    text: חיבור הדומיין, בדיקה אחרונה והדרכה לעדכון תוכן.
needFromYou:
  - טקסטים, או נקודות שמהן נכתוב אותם יחד
  - לוגו ותמונות
  - גישה לדומיין, או החלטה על שם מי לרשום דומיין חדש
  - איש קשר אחד לאישורים
afterDelivery:
  - תקופת תיקונים מוגדרת אחרי העלייה לאוויר
  - תחזוקה ועדכונים לפי בחירה, בהסכם נפרד
  - 'הדומיין והאחסון: סוגרים מראש על שם מי הם נרשמים'
faq:
  - question: אפשר לעדכן את האתר לבד אחרי שהוא עולה?
    answer: >-
      כן, אם זה חלק מההצעה. יש ממשק לעריכת תוכן, ומקבלים הדרכה קצרה.
  - question: האתר יהיה נגיש?
    answer: >-
      אני בונה לפי WCAG 2.1 ברמה AA, ובודק בכלים אוטומטיים ובניווט מקלדת.
      הצהרת הנגישות והתאמות נוספות נסגרות בהצעה.
  - question: על שם מי הדומיין והאחסון?
    answer: >-
      סוגרים את זה מראש. ההמלצה שלי היא על שמכם, כדי שתמיד תהיה לכם גישה.
  - question: יש קידום בגוגל?
    answer: >-
      יש SEO בסיסי, כותרות, תיאורים, מפת אתר ונתונים מובנים. קידום שוטף הוא
      שירות נפרד.
relatedDisciplines:
