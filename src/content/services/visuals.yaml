process:
  - title: בריף
    text: איפה התמונות יופיעו, באילו גדלים, ואיזו תחושה הן צריכות להעביר.
  - title: כיוון וסקיצות
    text: שניים או שלושה כיוונים ראשוניים, ובוחרים יחד אחד.
  - title: הסט המלא
    text: עבודה על כל התמונות בכיוון שנבחר, עם נקודת אישור באמצע.
  - title: תיקונים ומסירה
    text: סבבי התיקון שסוכמו, ואחריהם הקבצים בכל הגדלים.
needFromYou:
  - איפה התמונות יופיעו ובאילו גדלים
  - לוגו, פונטים וצבעי מותג, אם יש
  - רפרנסים שאתם אוהבים, וגם כאלה שלא
  - תמונות שלכם, אם רוצים לשלב אותן
afterDelivery:
  - הקבצים הסופיים נשמרים אצלי לתקופה מוסכמת
  - גדלים נוספים מאותו סט אפשר להזמין גם אחר כך
  - זכויות השימוש בתמונות מפורטות בכתב
faq:
  - question: התמונות נוצרות ב-AI?
    answer: >-
      חלקן, כשזה מתאים לרעיון. AI משמש אותי כנקודת התחלה, ואז אני עורך, מרכיב
      ומתקן ידנית. בכל פרויקט כתוב מה נוצר ב-AI.
  - question: אפשר לשלב תמונות שלי?
    answer: >-
      כן. אפשר לערוך תמונות שלכם, או לשלב אותן בקומפוזיציה עם אלמנטים
      נוספים.
  - question: למה אפשר להשתמש בתמונות?
    answer: >-
      לפי מה שסוכם בהצעה, למשל רשתות, אתר או דפוס. זכויות השימוש מפורטות
      בכתב.
