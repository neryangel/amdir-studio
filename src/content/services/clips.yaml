title: הפקת קליפים
summary: >-
  קליפ לשיר, מהרעיון ועד הגרסה הסופית: קונספט, צילום, עריכה ב-Premiere, ומושן
  ואפקטים ב-After Effects. איש קשר אחד לאורך כל הדרך.
cover: ../../assets/services/clips/cover.png
coverAlt: תמונה זמנית, אלומות אור על רקע כהה
whoFor:
  - אמנים והרכבים עם שיר שצריך קליפ
  - שיר שיוצא בקרוב וצריך גם גרסאות קצרות לרשתות
  - מי שיש לו רעיון לקליפ ומחפש שותף להפקה
whatYouGet:
  - קונספט ותסריט צילום (שוט ליסט)
  - ימי צילום לפי ההיקף שסוכם בהצעה
  - עריכה, תיקון צבע וסנכרון מדויק לשיר
  - מושן ואפקטים לפי הקונספט
  - גרסה מלאה לרוחב, וגרסאות 9:16 ו-1:1 לרשתות
  - קובץ כתוביות למילים, אם רוצים
timeline:
  - stage: קונספט ופרה-פרודקשן
    min: 1
    max: 3
    unit: weeks
  - stage: צילום
    min: 1
    max: 2
    unit: days
  - stage: עריכה וגרסה ראשונה
    min: 1
    max: 2
    unit: weeks
  - stage: סבבי תיקונים
    min: 3
    max: 7
    unit: days
  - stage: מסירה
    min: 1
    max: 2
    unit: days
process:
  - title: מקשיבים לשיר
    text: על מה השיר, מי הקהל, איפה הקליפ יוצג ומה התאריך שחשוב לכם.
  - title: קונספט ותכנון
    text: רעיון בכתב עם רפרנסים, ואחרי אישור, שוט ליסט, לוקיישן ולוח צילום.
  - title: צילום
    text: יום הצילום לפי התכנון, עם מקום לרגעים שלא תוכננו.
  - title: עריכה, מושן ואפקטים
    text: גרסה ראשונה בקישור צפייה פרטי, ואחריה סבבי תיקון שסוכמו מראש.
  - title: מסירה
    text: גרסה מלאה וגרסאות לרשתות, בפורמטים שסוכמו.
needFromYou:
  - השיר במיקס סופי (או קרוב לסופי), כקובץ WAV
  - רפרנסים, קליפים, צבעים או תמונות שמדברים אליכם
  - תאריך היציאה של השיר, אם כבר נקבע
  - אישור שיש לכם זכויות בשיר לשימוש בקליפ
afterDelivery:
  - הקבצים הסופיים נשמרים אצלי לתקופה מוסכמת
  - סבבי תיקון מוגדרים מראש, ומה שמעבר להם מתומחר בנפרד
  - זכויות השימוש בקליפ מפורטות בכתב
faq:
  - question: צריך שהשיר יהיה גמור לפני שמתחילים?
    answer: >-
      עדיף. אפשר להתחיל קונספט על גרסת דמו, אבל את העריכה עושים על המיקס
      הסופי, כי כל חיתוך מסונכרן לשיר.
  - question: יש לי כבר חומר מצולם. אפשר רק עריכה?
    answer: >-
      כן. זה נכנס תחת עריכת וידאו ומושן: עריכה, צבע, מושן ואפקטים על חומר
      שכבר צולם.
  - question: איך AI נכנס לקליפ?
    answer: >-
      רק כשהוא משרת את הרעיון, למשל רקע לסצנה או אלמנט שאי אפשר לצלם. התוצאה
      עוברת עריכה ידנית, וזה מצוין בקרדיטים.
  - question: כמה סבבי תיקונים יש?
    answer: >-
      מספר הסבבים נקבע בהצעה, לפני שמתחילים. אם צריך יותר, מדברים על זה
      קודם, ורק אז ממשיכים.
  - question: של מי הזכויות בקליפ?
    answer: >-
      הזכויות בשיר נשארות שלכם. זכויות השימוש בקליפ מפורטות בכתב בהצעה.
