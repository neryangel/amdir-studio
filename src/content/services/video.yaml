title: עריכת וידאו ומושן
summary: >-
  עריכה ב-Premiere, ומושן גרפיקס ואפקטים ב-After Effects, לסרטונים של עסקים,
  מותגים ואירועים. מחומר שכבר צולם, או יחד עם צילום.
cover: ../../assets/services/video/cover.png
coverAlt: תמונה זמנית, אלומות אור על במה חשוכה
whoFor:
  - עסקים ומותגים שצריכים סרטון קצר וברור
  - אירועים שצריכים טיזר לפני וסרטון סיכום אחרי
  - חומר גלם שמחכה לעריכה
  - סרטון קיים שצריך פתיח, לוגו מונפש או גרפיקה
whatYouGet:
  - עריכה, תיקון צבע וסאונד בסיסי
  - מושן גרפיקס, כותרות ולוגו מונפש
  - אפקטים וקומפוזיטינג לפי הצורך
  - כתוביות בעברית
  - גרסאות לפי הפלטפורמה, 16:9, 9:16 ו-1:1
timeline:
  - stage: קבלת חומרים ובריף
    min: 1
    max: 3
    unit: days
  - stage: גרסה ראשונה
    min: 3
    max: 10
    unit: days
  - stage: סבבי תיקונים
    min: 2
    max: 5
    unit: days
  - stage: מסירה
    min: 1
    max: 2
    unit: days
process:
  - title: בריף
    text: מה הסרטון צריך לעשות, איפה יוצג, באיזה אורך, ומה כבר יש.
  - title: מעבר על החומר
    text: אני עובר על חומר הגלם ומציע מבנה, עוד לפני שמתחילים לחתוך.
  - title: גרסה ראשונה
    text: עריכה, צבע ומושן, בקישור צפייה פרטי עם הערות לפי זמן בסרטון.
  - title: תיקונים ומסירה
    text: סבבי התיקון שסוכמו, ואחריהם הקבצים בכל הגרסאות.
needFromYou:
  - חומר הגלם בקישור הורדה (לא בוואטסאפ, שדוחס את הקבצים)
  - לוגו, פונטים וצבעי מותג, אם יש
  - מוזיקה שיש לכם זכויות בה, או שנבחר יחד מספרייה מורשית
  - איפה הסרטון יוצג ובאיזה אורך
afterDelivery:
  - הקבצים הסופיים נשמרים אצלי לתקופה מוסכמת
  - גרסאות נוספות מאותו חומר אפשר להזמין גם אחר כך
  - זכויות השימוש בתוצר מפורטות בכתב
faq:
  - question: אפשר לשלוח חומר גלם בוואטסאפ?
    answer: >-
      עדיף שלא. וואטסאפ דוחס את הקבצים ופוגע באיכות. קישור הורדה, למשל Google
      Drive או WeTransfer, שומר על הקובץ המקורי.
  - question: מאיפה המוזיקה?
    answer: >-
      מוזיקה שיש לכם זכויות בה, או מספרייה שמורשית לשימוש מסחרי. לא משתמשים
      בשיר בלי רישיון.
  - question: אפשר רק מושן, בלי עריכה?
    answer: >-
      כן. לוגו מונפש, פתיח, כותרות או אינפוגרפיקה לסרטון שכבר ערוך.
  - question: באיזה פורמט אקבל את הקבצים?
    answer: >-
      בדרך כלל MP4 לרשתות ולאתר, ולפי הצורך גם קובץ איכותי לארכיון. הפורמטים
      נסגרים בהצעה.
relatedDisciplines:
