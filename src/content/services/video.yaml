  - title: הצעה ותכנון
    text: היקף, לוח זמנים ומחיר בכתב, לפני שמתחילים.
  - title: עבודה עם נקודות אישור
    text: גרסה לבדיקה בכל שלב מוסכם, עם סבבי תיקון מוגדרים.
  - title: מסירה וליווי
    text: קבצים סופיים בפורמטים שסוכמו, וזכויות שימוש בכתב.
afterDelivery:
