brief: 'בריף לדוגמה: שיר פופ של שלוש וחצי דקות, יום צילום אחד ובמה קטנה בלי תאורת הופעה. הקליפ צריך לעבוד גם לרוחב ביוטיוב וגם לאורך בסטוריז, בלי לצלם פעמיים.'
approach: 'הכול נבנה סביב האור. הבמה צולמה כמעט חשוכה, עם מקור אור אחד, ובפוסט נוספו אלומות ואבק שנעים עם הקצב. העריכה נעשתה ב-Premiere על גריד של פעמות, והאפקטים ב-After Effects.


  המסגור תוכנן מראש לשלושה יחסים: כל שוט ממוקם כך שהחיתוך ל-9:16 ול-1:1 לא מפספס את מה שחשוב.'
